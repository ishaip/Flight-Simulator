name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - run: make test
      - run: make lint

  build-docker:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flight-simulator:latest
            ${{ secrets.DOCKER_USERNAME }}/flight-simulator:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binaries:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            filename: flight-simulator-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            filename: flight-simulator-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            filename: flight-simulator-macos-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            filename: flight-simulator-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          cd backend && go build -ldflags="-s -w" -o ../bin/${{ matrix.filename }} ./cmd/simulator
      - uses: softprops/action-gh-release@v1
        with:
          files: bin/${{ matrix.filename }}
